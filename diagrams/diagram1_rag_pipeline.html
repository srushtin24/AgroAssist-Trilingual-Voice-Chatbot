<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagram 1 - RAG Query Pipeline</title>
<style>
  body { margin: 0; background: #ffffff; display: flex; justify-content: center; padding: 20px; }
  svg { font-family: Arial, sans-serif; }
</style>
</head>
<body>
<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#111">RAG chatbot — query pipeline</text>
  <text x="340" y="42" text-anchor="middle" font-size="12" fill="#666">What happens every time a user sends a message</text>

  <!-- Step 1: User sends message -->
  <rect x="220" y="58" width="240" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">User sends message</text>
  <text x="340" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">text or voice input</text>

  <line x1="340" y1="102" x2="340" y2="130" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 2: Language detected -->
  <rect x="200" y="130" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Language detected</text>
  <text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">EN / HI / MR toggle selection</text>

  <line x1="340" y1="182" x2="340" y2="210" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 3: Query embedded -->
  <rect x="190" y="210" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="230" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">Query embedded</text>
  <text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">all-MiniLM-L6-v2 model</text>

  <line x1="340" y1="262" x2="340" y2="290" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 4: Top-4 chunks retrieved -->
  <rect x="175" y="290" width="330" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#633806">Top-4 chunks retrieved</text>
  <text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">cosine similarity search — ChromaDB</text>

  <line x1="340" y1="342" x2="340" y2="370" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 5: Prompt built -->
  <rect x="165" y="370" width="350" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="390" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C">Prompt built</text>
  <text x="340" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">system prompt + session history + context + query</text>

  <line x1="340" y1="422" x2="340" y2="450" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 6: LLM generates reply -->
  <rect x="175" y="450" width="330" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="470" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C">LLM generates reply</text>
  <text x="340" y="488" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">Groq API — LLaMA 3.3 70B</text>

  <line x1="340" y1="502" x2="340" y2="528" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Step 7: Output -->
  <rect x="185" y="528" width="310" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="340" y="548" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#27500A">Reply displayed + spoken</text>
  <text x="340" y="563" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">text shown + TTS in selected language</text>

  <!-- Session memory box on right -->
  <rect x="530" y="370" width="124" height="52" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="592" y="390" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#374151">Session memory</text>
  <text x="592" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6B7280">last 10 messages</text>
  <line x1="530" y1="396" x2="517" y2="396" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
</svg>
</body>
</html>
