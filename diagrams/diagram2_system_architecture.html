<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagram 2 - System Architecture</title>
<style>
  body { margin: 0; background: #ffffff; display: flex; justify-content: center; padding: 20px; }
  svg { font-family: Arial, sans-serif; }
</style>
</head>
<body>
<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#111">AgroAssist chatbot — system architecture</text>

  <!-- FRONTEND container -->
  <rect x="20" y="50" width="170" height="220" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="105" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Frontend</text>
  <text x="105" y="88" text-anchor="middle" font-size="11" fill="#0F6E56">React / HTML + CSS</text>
  <rect x="36" y="100" width="138" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="105" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">ChatBot.jsx</text>
  <rect x="36" y="146" width="138" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="105" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">Lang toggle (EN/HI/MR)</text>
  <rect x="36" y="192" width="138" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="105" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">Voice I/O (Web Speech)</text>
  <rect x="36" y="238" width="138" height="24" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="105" y="250" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">TTS + stop button</text>

  <!-- Arrow frontend → backend -->
  <line x1="190" y1="165" x2="228" y2="165" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="209" y="156" text-anchor="middle" font-size="10" fill="#555">POST</text>
  <text x="209" y="168" text-anchor="middle" font-size="10" fill="#555">/api/chat</text>

  <!-- BACKEND container -->
  <rect x="228" y="50" width="170" height="220" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="313" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Backend</text>
  <text x="313" y="88" text-anchor="middle" font-size="11" fill="#534AB7">FastAPI — Python</text>
  <rect x="244" y="100" width="138" height="36" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="313" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#26215C">main.py</text>
  <rect x="244" y="146" width="138" height="36" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="313" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#26215C">rag_chat.py</text>
  <rect x="244" y="192" width="138" height="36" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="313" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#26215C">Session memory</text>
  <rect x="244" y="238" width="138" height="24" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="313" y="250" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#26215C">LangChain pipeline</text>

  <!-- Arrow backend → chromadb -->
  <line x1="398" y1="140" x2="436" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="417" y="132" text-anchor="middle" font-size="10" fill="#555">similarity</text>
  <text x="417" y="144" text-anchor="middle" font-size="10" fill="#555">search</text>

  <!-- Arrow backend → groq -->
  <line x1="398" y1="190" x2="560" y2="360" stroke="#555" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- CHROMADB container -->
  <rect x="436" y="50" width="200" height="180" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="536" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">ChromaDB</text>
  <text x="536" y="88" text-anchor="middle" font-size="11" fill="#854F0B">local vector store</text>
  <rect x="452" y="100" width="168" height="36" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="536" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">Plant PDF embeddings</text>
  <rect x="452" y="146" width="168" height="36" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="536" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">Text chunks (800 char)</text>
  <rect x="452" y="192" width="168" height="30" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="536" y="207" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">persisted on disk</text>

  <!-- GROQ box -->
  <rect x="436" y="360" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="536" y="381" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#4A1B0C">Groq API</text>
  <text x="536" y="400" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">LLaMA 3.3 70B — cloud inference</text>

  <!-- INGESTION pipeline bottom -->
  <rect x="20" y="300" width="390" height="64" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text x="35" y="318" font-size="11" font-weight="600" fill="#374151">One-time ingestion — ingest.py</text>
  <rect x="30" y="328" width="88" height="24" rx="5" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="74" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">Plant PDFs</text>
  <line x1="118" y1="340" x2="138" y2="340" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="138" y="328" width="96" height="24" rx="5" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="186" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">Chunk + embed</text>
  <line x1="234" y1="340" x2="254" y2="340" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="254" y="328" width="110" height="24" rx="5" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="309" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">Save to ChromaDB</text>
  <path d="M364 340 L420 340 L420 232 L436 232" fill="none" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="392" width="390" height="80" rx="8" fill="none" stroke="#E5E7EB" stroke-width="0.8"/>
  <text x="36" y="412" font-size="11" font-weight="600" fill="#374151">Legend</text>
  <rect x="36" y="422" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="54" y="432" font-size="11" fill="#374151">Frontend</text>
  <rect x="116" y="422" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="134" y="432" font-size="11" fill="#374151">Backend</text>
  <rect x="196" y="422" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="214" y="432" font-size="11" fill="#374151">Vector DB</text>
  <rect x="286" y="422" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="304" y="432" font-size="11" fill="#374151">LLM (Groq)</text>
  <rect x="36" y="448" width="12" height="12" rx="2" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="54" y="458" font-size="11" fill="#374151">Ingestion pipeline (one-time)</text>
</svg>
</body>
</html>
