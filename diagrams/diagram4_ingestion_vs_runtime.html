<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagram 4 - Ingestion vs Runtime Pipeline</title>
<style>
  body { margin: 0; background: #ffffff; display: flex; justify-content: center; padding: 20px; }
  svg { font-family: Arial, sans-serif; }
</style>
</head>
<body>
<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#111">RAG chatbot — two-pipeline architecture</text>
  <text x="340" y="42" text-anchor="middle" font-size="12" fill="#666">Ingestion runs once · Runtime runs on every message</text>

  <!-- LEFT: Ingestion pipeline container -->
  <rect x="20" y="60" width="298" height="360" rx="12" fill="#FFFBF0" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text x="169" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#633806">Ingestion pipeline</text>
  <text x="169" y="100" text-anchor="middle" font-size="11" fill="#854F0B">run once — python ingest.py</text>

  <rect x="60" y="116" width="218" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="169" y="137" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#633806">Plant PDF documents</text>
  <text x="169" y="152" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">tomato.pdf, wheat.pdf, ...</text>

  <line x1="169" y1="160" x2="169" y2="188" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="50" y="188" width="238" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="169" y="209" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#633806">PyMuPDF loader</text>
  <text x="169" y="224" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">extract text from each page</text>

  <line x1="169" y1="232" x2="169" y2="260" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="40" y="260" width="258" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="169" y="281" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#633806">Text splitter</text>
  <text x="169" y="296" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">800 char chunks, 100 overlap</text>

  <line x1="169" y1="304" x2="169" y2="332" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="40" y="332" width="258" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="169" y="353" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#633806">Embed (all-MiniLM-L6-v2)</text>
  <text x="169" y="368" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">convert text → vectors</text>

  <line x1="169" y1="376" x2="169" y2="400" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="56" y="400" width="226" height="10" rx="4" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/>
  <text x="169" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#633806">Saved to ChromaDB on disk</text>

  <!-- RIGHT: Runtime pipeline container -->
  <rect x="362" y="60" width="298" height="360" rx="12" fill="#F0F0FF" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text x="511" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Runtime pipeline</text>
  <text x="511" y="100" text-anchor="middle" font-size="11" fill="#534AB7">every user message — rag_chat.py</text>

  <rect x="400" y="116" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="510" y="137" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C">User query arrives</text>
  <text x="510" y="152" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">text or voice transcription</text>

  <line x1="510" y1="160" x2="510" y2="188" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="388" y="188" width="244" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="510" y="209" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C">Embed query</text>
  <text x="510" y="224" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">same model — all-MiniLM-L6-v2</text>

  <line x1="510" y1="232" x2="510" y2="260" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="378" y="260" width="264" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="510" y="281" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C">Retrieve top-4 chunks</text>
  <text x="510" y="296" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">cosine similarity — ChromaDB</text>

  <line x1="510" y1="304" x2="510" y2="332" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="378" y="332" width="264" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="510" y="353" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#26215C">Build prompt + call LLM</text>
  <text x="510" y="368" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">context + history → Groq LLaMA 3.3</text>

  <line x1="510" y1="376" x2="510" y2="400" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="394" y="400" width="232" height="10" rx="4" fill="#7F77DD" stroke="#534AB7" stroke-width="0.5"/>
  <text x="510" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#26215C">Grounded reply returned to user</text>

  <!-- Shared ChromaDB bridge -->
  <path d="M318 376 L340 376 L340 280 L362 280" fill="none" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow-orange)"/>
  <text x="340" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#854F0B">shared</text>
  <text x="340" y="342" text-anchor="middle" font-size="10" fill="#854F0B">ChromaDB</text>

  <!-- Bottom note -->
  <text x="169" y="448" text-anchor="middle" font-size="11" fill="#854F0B">runs once (or when PDFs change)</text>
  <text x="510" y="448" text-anchor="middle" font-size="11" fill="#534AB7">runs on every chat message</text>
</svg>
</body>
</html>
