<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Diagram 3 - Deployment Architecture</title>
<style>
  body { margin: 0; background: #ffffff; display: flex; justify-content: center; padding: 20px; }
  svg { font-family: Arial, sans-serif; }
</style>
</head>
<body>
<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#111">AgroAssist — deployment architecture</text>
  <text x="340" y="42" text-anchor="middle" font-size="12" fill="#666">Railway (backend) + Vercel (frontend) + Groq (LLM cloud)</text>

  <!-- User device -->
  <rect x="20" y="170" width="120" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="80" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">User device</text>
  <text x="80" y="210" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Chrome browser</text>

  <!-- Arrow user → Vercel -->
  <line x1="140" y1="200" x2="188" y2="200" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="164" y="192" text-anchor="middle" font-size="10" fill="#555">HTTPS</text>

  <!-- VERCEL container -->
  <rect x="188" y="90" width="170" height="220" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="273" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#085041">Vercel</text>
  <text x="273" y="128" text-anchor="middle" font-size="11" fill="#0F6E56">free static hosting</text>
  <rect x="204" y="142" width="138" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="273" y="160" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">React frontend</text>
  <rect x="204" y="188" width="138" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="273" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">ChatBot.jsx</text>
  <rect x="204" y="234" width="138" height="36" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="273" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">ChatBot.css</text>
  <rect x="204" y="280" width="138" height="24" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="273" y="292" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">Web Speech API</text>

  <!-- Arrow Vercel → Railway -->
  <line x1="358" y1="200" x2="406" y2="200" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="382" y="188" text-anchor="middle" font-size="10" fill="#555">POST /api/chat</text>
  <text x="382" y="200" text-anchor="middle" font-size="10" fill="#555">HTTPS + CORS</text>

  <!-- RAILWAY container -->
  <rect x="406" y="60" width="200" height="300" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="506" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">Railway</text>
  <text x="506" y="98" text-anchor="middle" font-size="11" fill="#534AB7">backend server — free tier</text>
  <rect x="422" y="112" width="168" height="36" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="506" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#26215C">FastAPI + uvicorn</text>
  <rect x="422" y="158" width="168" height="36" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="506" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#26215C">rag_chat.py</text>
  <rect x="422" y="204" width="168" height="36" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="506" y="222" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">ChromaDB (disk)</text>
  <rect x="422" y="250" width="168" height="36" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="506" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">Plant PDFs</text>
  <rect x="422" y="296" width="168" height="28" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="506" y="310" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">GROQ_API_KEY (.env)</text>
  <rect x="422" y="332" width="168" height="20" rx="4" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="506" y="342" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#2C2C2A">requirements.txt + Procfile</text>

  <!-- Arrow Railway → Groq -->
  <line x1="606" y1="176" x2="634" y2="176" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="620" y="168" text-anchor="middle" font-size="10" fill="#555">API call</text>

  <!-- Groq cloud box -->
  <rect x="634" y="140" width="30" height="72" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="649" y="160" text-anchor="middle" font-size="10" font-weight="600" fill="#4A1B0C">Groq</text>
  <text x="649" y="176" text-anchor="middle" font-size="10" fill="#993C1D">API</text>
  <text x="649" y="192" text-anchor="middle" font-size="10" fill="#993C1D">cloud</text>

  <!-- GitHub → Railway deploy arrow -->
  <rect x="406" y="390" width="200" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
  <text x="506" y="410" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">GitHub repository</text>
  <text x="506" y="428" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">source code + chroma_db/</text>
  <line x1="506" y1="390" x2="506" y2="362" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arrow-dashed)"/>
  <text x="520" y="378" font-size="10" fill="#9CA3AF">auto-deploy on push</text>

  <!-- Legend -->
  <rect x="20" y="390" width="360" height="68" rx="8" fill="none" stroke="#E5E7EB" stroke-width="0.8"/>
  <text x="36" y="408" font-size="11" font-weight="600" fill="#374151">Deployment zones</text>
  <rect x="36" y="418" width="14" height="10" rx="2" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="56" y="427" font-size="11" fill="#374151">Vercel (frontend)</text>
  <rect x="156" y="418" width="14" height="10" rx="2" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="176" y="427" font-size="11" fill="#374151">Railway (backend)</text>
  <rect x="290" y="418" width="14" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="310" y="427" font-size="11" fill="#374151">Groq (cloud)</text>
  <text x="36" y="450" font-size="11" fill="#6B7280">Both Vercel and Railway are free tier — no credit card required</text>
</svg>
</body>
</html>
